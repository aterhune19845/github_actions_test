name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "80"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip ruff pytest pytest-cov

      - name: Lint Python project
        run: ruff check .

      - name: Test Python project with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under="$COVERAGE_THRESHOLD"
